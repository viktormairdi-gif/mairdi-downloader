<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #F58735; --accent-2: #E0661B; --line: #E3E6EA; --muted: #6B7480; --bg: #fff; --text: #1E2329; --soft: #FFF1E6; }
  @media (prefers-color-scheme: dark) { :root { --line: #30363D; --muted: #98A1AC; --bg: #1E2227; --text: #E6E8EB; --soft: #3A2A1E; } }
  body { margin: 0; width: 320px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header img { width: 28px; height: 28px; }
  header b { font-size: 14px; }
  #st { margin-left: auto; font-size: 11.5px; padding: 2px 8px; border-radius: 10px; background: var(--soft); color: var(--muted); }
  #st.ok { color: #2E9E5B; } #st.bad { color: #D64545; }
  section { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-2); }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  select { font: inherit; padding: 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .muted { color: var(--muted); font-size: 12px; }
  #videoBox[hidden], label[hidden] { display: none; }
  label.drive { font-size: 12.5px; }
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><b>MAIRDI Загрузчик</b><span id="st">…</span></header>
<section id="videoBox" hidden>
  <div><b>На этой странице есть видео</b></div>
  <div class="row">
    <select id="q">
      <option value="best">Лучшее качество</option><option value="2160">до 4K</option><option value="1080" selected>до 1080p</option>
      <option value="720">до 720p</option><option value="480">до 480p</option><option value="audio">Только звук (MP3)</option>
    </select>
    <button class="primary" id="dlVideo">Скачать</button>
  </div>
  <label class="drive" hidden><input type="checkbox" class="toDrive"> ☁ Сразу на Google Диск</label>
</section>
<section>
  <label><input type="checkbox" id="intercept"> Перехватывать загрузки браузера</label>
  <label><input type="checkbox" id="exclude"> Не перехватывать на этом сайте</label>
  <div class="muted" id="site"></div>
</section>
<section>
  <div class="row"><button id="dlPageVideo">Скачать видео со страницы</button></div>
  <div class="row"><button id="dlAll">Все файлы со страницы</button><button id="open">Открыть программу</button></div>
  <div class="muted" id="msg"></div>
</section>
<script src="popup.js"></script>
</body>
</html>
